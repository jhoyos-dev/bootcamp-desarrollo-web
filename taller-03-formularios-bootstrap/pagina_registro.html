<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="libreria/css/bootstrap.min.css">
    <title>Area de registro</title>
</head>  
<html dir="center"></html> 
<body bgcolor="grey"><center>
   <h1>Ingreso de datos para el registro</h1> 
   <form action="main.js" method="post">
        <label for="nom">Usuario</label>
        <input type="text" name="nom" id="usuario" placeholder="Ingrese su usuario" maxlength="50" required>
        <br><br>
        <label for="pas">Contraseña</label>
        <input type="password" name="password" id="pas" minlength="10" required>
        <br><br>
        <label for="correo">Correo electronico</label>
        <input type="email" id="correo" name="correo" required>
        <br><br>
        <h2>Datos Personales del usuario:</h2>
        <label for="nom">Nombres y apellidos</label>
        <input type="text" name="nom" id="nom" placeholder="Ingrese nombre completo" maxlength="80" required>
        <br><br>
        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="1" max="150" required>
        <br><br>
        <label for="Cedula">Cedula</label>
        <input type="number" id="Cedula" name="cedula" minlength="5" maxlength="15" placeholder="No puntos ni comas" required>
        <br><br>
        <label>Estado Civil</label>
        <select name="estado_c" id="estado_c">
            <option value="">Eliga un estado civil</option>
            <option value="Soltero/a">Soltero/a</option>
            <option value="Casado/a">Casado/a</option>
            <option value="Viudo/a">Viudo/a</option>
            <option value="Unión libre">Unión libre</option>
            <option value="Unión marital">Unión marital</option>
            <option value="Prefiero no decir">Prefiero no decir</option>
        </select>
        <br><br>
        <label for="tel">Telefono</label>
        <input type="number" id="tel" name="tel" maxlength="12" required>
        <br><br>
        <label for="fecha_nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        <br><br>
        <h3>Genero:</h3>
        <input type="radio" name="genero" value="Masculino">Masculino
        <br>
        <input type="radio" name="genero" value="Femenino">Femenino
        <input type="radio" name="genero" value="Prefiero no decirlo">Prefiero no decirlo
        <br><br>
        <h2>Información extra:</h2>
        <label>Estudios culminados</label>
        <select name="estudios" id="estudios">
            <option value="">Eliga una opción</option>
            <option value="Bachiller no culminado">Baciller no culminado</option>
            <option value="Bachiller">Bachiller</option>
            <option value="Tecnico o Tecnologo">Tecnico o Tecnologo</option>
            <option value="Carrera completa">Carrera completa</option>
            <option value="Doctorado">Doctorado</option>
            <option value="Especialización">Especialización</option>
        </select>
        <br><br>
        <label for="">Antecedentes de salud (Breve descripción)</label><br>
        <textarea name="salud" id="salud" rows="5" cols="50" placeholder="Escribir aqui maximo 100 caracteres"></textarea>
        <br><br>
        <label for="">Descripción de Hobbies y Deportes</label><br>
        <textarea name="hd" id="hd" rows="5" cols="50" placeholder="Escribir aqui maximo 100 caracteres"></textarea>
        <br><br>
        <label><input type="checkbox" name="terminos">Acepta los terminos y condiciones</label>
        <br>
        <label><input type="checkbox" name="terminos">Acepta el tratamiento de datos personales</label>
        <br><br>
        <button type="submit">Enviar registro</button>
    </form>
</body></center>
</html>
