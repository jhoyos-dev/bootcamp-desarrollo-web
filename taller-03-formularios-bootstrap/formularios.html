<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="libreria/css/bootstrap.min.css">
    <title>Formularios</title>
</head>   
<body class="text-center">
    <form action="main.js" method="post">
        <label for="nom">Nombre</label>
        <input type="text" id="nom" name="nombre" placeholder="Ingrese su nombre" required maxlength="30">
        <br><br>
        <label for="pas">Contraseña</label>
        <input type="password" id="pas" name="password" required minlength="8">
        <br><br>
        <label for="correo">E-Mail</label>
        <input type="email" id="correo" name="correo" required>
        <br><br>
        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="1" max="120" required>
        <br><br>
        <label for="fecha_nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        <br><br>
        <label><input type="checkbox" name="terminos">Acepta los terminos y condiciones</label>
        <br>
        <label><input type="checkbox" name="terminos">No acepto</label>
        <br><br>
        <p>Elige el genero:</p>
        <input type="radio" name="genero" value="masculino">Masculino 
        <br>
        <input type="radio" name="genero" value="femenino">Femenino
        <br>
        <input type="radio" name="genero" value="helicoptero_apache">Helicoptero Apache
        <br><br>
        <label for="pais">País</label>
        <select name="pais" id="pais">Pais>
          <option value="">Seleccione un pais</option>
          <option value="colombia">Colombia</option>
          <option value="brasil">Brasil</option>
          <option value="ecuador">Ecuador</option>
          <option value="Kely_mlp">Kely mlp hp</option>
    </select>
    <br><br>
    <label for="">Comentarios</label><br>
    <textarea name="comentarios" id="com" rows="5" cols="50" placeholder="Escribir aqui maximo 100 caracteres"></textarea>
    <br><br>
    <button type="submit">Enviar</button>
    </form>
</body> 
</html>
